name: Backend Stage 2 Checks
on:
  push:
    branches: [stage-2-backend-railway, stage-3-calling-webrtc, stage-4-messaging-numbers, integration-infobip]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nawslk
          POSTGRES_PASSWORD: local_ci_only
          POSTGRES_DB: nawslk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nawslk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
        env:
          TEST_DATABASE_URL: postgresql://nawslk:local_ci_only@localhost:5432/nawslk_test
      - name: Smoke test API with PostgreSQL
        env:
          DATABASE_URL: postgresql://nawslk:local_ci_only@localhost:5432/nawslk_test
          BOOTSTRAP_SECRET_SHA256: ffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff
          PORT: '3000'
        run: |
          node src/server.mjs > /tmp/nawslk-api.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3000/health > /tmp/health.json; then break; fi
            sleep 1
          done
          grep -q '"database":"connected"' /tmp/health.json
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/v1/me)" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:3000/v1/bootstrap -H 'Content-Type: application/json' -d '{"email":"owner@example.com"}')" = "403"
      - name: Install Chromium for real media transport test
        run: npx playwright install --with-deps chromium
      - name: Test bidirectional WebRTC audio without APK
        run: npm run test:webrtc
        env:
          TEST_DATABASE_URL: postgresql://nawslk:local_ci_only@localhost:5432/nawslk_test
      - name: Start disposable TURN for relay acceptance
        run: >-
          docker run -d --name nawslk-ci-turn --network host coturn/coturn:4.6.3
          -n --no-cli --fingerprint --use-auth-secret --realm=nawslk-ci
          --static-auth-secret=ephemeral_ci_turn_sharedsecret --listening-ip=127.0.0.1
          --relay-ip=127.0.0.1 --external-ip=127.0.0.1
          --min-port=50000 --max-port=50050 --allow-loopback-peers
          --log-file=stdout
      - name: Test audio with forced TURN and measured network loss
        run: npm run test:webrtc
        timeout-minutes: 3
        env:
          TEST_DATABASE_URL: postgresql://nawslk:local_ci_only@localhost:5432/nawslk_test
          TEST_TURN_URL: turn:127.0.0.1:3478?transport=udp
          TEST_TURN_SHARED_SECRET: ephemeral_ci_turn_sharedsecret
      - name: Test standalone production TURN probe against disposable relay
        run: npm run probe:turn
        timeout-minutes: 2
        env:
          TURN_URLS: turn:127.0.0.1:3478?transport=udp
          TURN_SHARED_SECRET: ephemeral_ci_turn_sharedsecret
      - name: Clean up disposable TURN
        if: always()
        run: docker rm -f nawslk-ci-turn || true
