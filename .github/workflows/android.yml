name: Android Stage 1 Checks
on:
  push:
    branches: [stage-1-foundation, stage-2-backend-railway, stage-3-calling-webrtc, stage-4-messaging-numbers]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK packages
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Compile and run unit tests without packaging APK
        run: gradle :app:compileDebugKotlin :app:testDebugUnitTest --stacktrace
      - name: Upload Room schemas and unit test reports (no APK)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-reports-and-room-schema
          path: |
            app/build/test-results/testDebugUnitTest/
            app/schemas/
